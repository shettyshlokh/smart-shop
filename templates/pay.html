{% extends "base.html" %}
{% block title %}Pay for order #{{ order.id }}{% endblock %}
{% block content %}
<div class="card pay-card">
  <h1>💳 Pay ₹{{ '%.2f'|format(order.amount_due) }}</h1>
  <p>Order #{{ order.id }} at <b>{{ shop.name }}</b></p>
  <button id="pay-btn" class="big">Pay now (UPI / Card / Netbanking)</button>
  <p class="muted">Payments are processed securely by Razorpay.</p>
  <a href="{{ url_for('order_status', order_id=order.id, phone=order.customer_phone) }}">Pay later</a>
</div>

<form id="verify" method="post" action="{{ url_for('pay_verify', order_id=order.id) }}">
  <input type="hidden" name="phone" value="{{ order.customer_phone }}">
  <input type="hidden" name="razorpay_order_id">
  <input type="hidden" name="razorpay_payment_id">
  <input type="hidden" name="razorpay_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  const rzp = new Razorpay({
    key: "{{ key_id }}",
    order_id: "{{ rp_order_id }}",
    amount: {{ (order.amount_due * 100)|round|int }},
    currency: "INR",
    name: {{ shop.name|tojson }},
    description: "Order #{{ order.id }}",
    prefill: { name: {{ order.customer_name|tojson }}, contact: {{ order.customer_phone|tojson }},
               email: {{ (order.customer_email or '')|tojson }} },
    theme: { color: "#4f46e5" },
    handler: function (resp) {           // called by Razorpay after a successful payment
      const f = document.getElementById('verify');
      f.razorpay_order_id.value = resp.razorpay_order_id;
      f.razorpay_payment_id.value = resp.razorpay_payment_id;
      f.razorpay_signature.value = resp.razorpay_signature;
      f.submit();                        // the server checks the signature before marking paid
    }
  });
  rzp.on('payment.failed', e => alert('Payment failed: ' + e.error.description));
  document.getElementById('pay-btn').onclick = () => rzp.open();
  rzp.open();
</script>
{% endblock %}
